# Deploy zonewise-agents to Google Cloud Run (free tier: scale-to-zero).
# READY-TO-ENABLE: add GCP_* secrets, then push to main or run workflow_dispatch.
#
# Auth (pick one):
#   WIF: GCP_PROJECT_ID + GCP_WORKLOAD_IDENTITY_PROVIDER + GCP_SERVICE_ACCOUNT
#   SA:  GCP_PROJECT_ID + GCP_SA_KEY  (JSON key)
#
# App secrets (already in repo): SUPABASE_URL, SUPABASE_SERVICE_KEY, ANTHROPIC_API_KEY
# Mapping: SUPABASE_SERVICE_KEY -> container env SUPABASE_KEY (server.main requirement).
# Optional: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
#
# Until GCP_* secrets exist, the gate job exits 0 with a skip message (no failed checks).

name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  SERVICE: zonewise-agents
  REGION: us-east1
  AR_REPO: zonewise

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GCP_WIF: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        run: |
          if [ -n "$GCP_PROJECT_ID" ] && { [ -n "$GCP_SA_KEY" ] || [ -n "$GCP_WIF" ]; }; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "GCP secrets present — will deploy"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "⏭️ Skipping Cloud Run deploy: set GCP_PROJECT_ID and (GCP_SA_KEY or GCP_WORKLOAD_IDENTITY_PROVIDER)."
            echo "See DEPLOYMENT.md Cloud Run section."
          fi

  deploy:
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (WIF)
        if: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && secrets.GCP_SERVICE_ACCOUNT != '' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Authenticate to Google Cloud (SA key)
        if: ${{ secrets.GCP_SA_KEY != '' && secrets.GCP_WORKLOAD_IDENTITY_PROVIDER == '' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Enable APIs + Artifact Registry
        run: |
          gcloud config set project "${{ secrets.GCP_PROJECT_ID }}"
          gcloud services enable run.googleapis.com cloudbuild.googleapis.com artifactregistry.googleapis.com --quiet
          if ! gcloud artifacts repositories describe "${AR_REPO}" --location="${REGION}" >/dev/null 2>&1; then
            gcloud artifacts repositories create "${AR_REPO}" \
              --repository-format=docker \
              --location="${REGION}" \
              --description="ZoneWise Agents"
          fi

      - name: Build and push image
        run: |
          PROJECT="${{ secrets.GCP_PROJECT_ID }}"
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT}/${AR_REPO}/${SERVICE}:${GITHUB_SHA}"
          IMAGE_LATEST="${REGION}-docker.pkg.dev/${PROJECT}/${AR_REPO}/${SERVICE}:latest"
          gcloud builds submit . --tag "${IMAGE}" --tag "${IMAGE_LATEST}"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          ENV_FILE="$(mktemp)"
          {
            printf 'SUPABASE_URL=%s\n' "${SUPABASE_URL}"
            printf 'SUPABASE_KEY=%s\n' "${SUPABASE_SERVICE_KEY}"
            printf 'ANTHROPIC_API_KEY=%s\n' "${ANTHROPIC_API_KEY}"
            [[ -n "${TELEGRAM_BOT_TOKEN:-}" ]] && printf 'TELEGRAM_BOT_TOKEN=%s\n' "${TELEGRAM_BOT_TOKEN}"
            [[ -n "${TELEGRAM_CHAT_ID:-}" ]] && printf 'TELEGRAM_CHAT_ID=%s\n' "${TELEGRAM_CHAT_ID}"
          } > "${ENV_FILE}"

          gcloud run deploy "${SERVICE}" \
            --image="${IMAGE}" \
            --region="${REGION}" \
            --platform=managed \
            --allow-unauthenticated \
            --memory=512Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=3 \
            --concurrency=80 \
            --timeout=300 \
            --port=8000 \
            --env-vars-file="${ENV_FILE}"

          rm -f "${ENV_FILE}"
          URL="$(gcloud run services describe "${SERVICE}" --region="${REGION}" --format='value(status.url)')"
          echo "SERVICE_URL=${URL}" >> "$GITHUB_ENV"
          {
            echo "### Cloud Run URL"
            echo "${URL}"
            echo "Health: ${URL}/health"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Probe /health
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -sfS "${SERVICE_URL}/health"; then
              echo
              exit 0
            fi
            sleep 5
          done
          echo "Health probe failed"
          exit 1
